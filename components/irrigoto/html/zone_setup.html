<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>irrigoto · Zone Setup</title>
<script>
(function(){
  try{var t=localStorage.getItem('irrigoto_theme');
    if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}
  fetch('/api/theme').then(function(r){return r.json();}).then(function(d){
    var t2=d.dark?'dark':'light';
    if(document.documentElement.dataset.theme!==t2){
      document.documentElement.dataset.theme=t2;
      try{localStorage.setItem('irrigoto_theme',t2);}catch(e){}}
  }).catch(function(){});
})();
// b532: set the device clock from this phone (as landing/schedule, b437), so
// ANY page opened after a power loss with no HA gives the unit a clock.
(function(){try{fetch('/api/time',{method:'POST',
  headers:{'Content-Type':'application/x-www-form-urlencoded'},
  body:'epoch='+Math.floor(Date.now()/1000)+'&tz='+(-new Date().getTimezoneOffset())
}).catch(function(){});}catch(e){}})();
// b535: winter mode -- the only allowed action is exiting winter, which
// lives on the home page. Lock this page (banner + no clicks + disabled
// controls, including ones this page renders later).
(function(){
  function lock(){
    fetch('/api/all').then(function(r){return r.json();}).then(function(d){
      if(!d||!d.winter)return;
      var st=document.createElement('style');
      st.textContent='body.winter-lock{pointer-events:none}body.winter-lock #winter-lock{pointer-events:auto}'
        +'body.winter-lock button,body.winter-lock input,body.winter-lock select,body.winter-lock canvas,body.winter-lock svg{opacity:.45}';
      document.head.appendChild(st);
      var b=document.createElement('div'); b.id='winter-lock';
      b.style.cssText='position:sticky;top:0;z-index:9999;margin:8px 12px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--green-dim);color:var(--text);border:1px solid var(--border);font:600 14px var(--font)';
      b.innerHTML='&#10052; Winter sleep active — controls are disabled. <a href="/" style="color:var(--green)">Go to the home page to resume normal operation</a>.';
      document.body.prepend(b); document.body.classList.add('winter-lock');
      var off=function(){document.querySelectorAll('button,input,select,textarea').forEach(function(e){e.disabled=true;});};
      off(); new MutationObserver(off).observe(document.body,{childList:true,subtree:true});
    }).catch(function(){});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',lock);else lock();
})();
</script>
<!-- Hearth's faces, matching the dashboard studio. Non-blocking: on the setup
     hotspot there is no internet, so this must never hold up first paint --
     media="print" keeps it off the critical path and onload promotes it. The
     system stack in --font/--display/--mono covers the offline case. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* ---- Shared prelude: Hearth component language ---- */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1014;--bg2:#15181e;--bg3:#1c2028;
  --green:#8a94ff;--green-dim:#222842;--green-glow:rgba(138,148,255,.28);
  --accent-ink:#0e1014;
  --pond:#b49bff;--pond-dim:rgba(180,155,255,.16);
  --orange:#ff9f40;--orange-dim:rgba(255,159,64,.14);
  --red:#ff5a5a;--red-dim:rgba(255,90,90,.14);
  --ok:#2fc77a;--ok-dim:rgba(47,199,122,.22);
  --text:#eceef3;--text-mid:#8c92a1;--text-dim:#4d5461;
  --border:#252932;--btn:#15181e;--btn-hover:#1c2028;
  --radius:14px;--radius-sm:10px;
  --radar-bg:#0a0c0f;--radar-grid:#272c38;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px -18px rgba(0,0,0,.65);
  /* Hearth faces; system fallbacks on the device AP */
  --font:"Geist","Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --display:"Bricolage Grotesque","Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  /* appended tokens; *-ink = text on a status tint */
  --dot:#1c2028;--tint:rgba(236,238,243,.09);--tint-2:rgba(236,238,243,.16);--ok-ink:#2fc77a;--orange-ink:#ff9f40;--red-ink:#ff5a5a;
  --scrim:rgba(8,10,14,.55);--knob:#ffffff;--shadow-float:0 30px 80px rgba(0,0,0,.35);--shadow-knob:0 1px 2px rgba(0,0,0,.2);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f4f7;--bg2:#ffffff;--bg3:#e9ebf0;
  --green:#4352f0;--green-dim:#dcdff6;--green-glow:rgba(67,82,240,.22);
  --accent-ink:#ffffff;
  --pond:#7b4dff;--pond-dim:rgba(123,77,255,.12);
  --orange:#c87210;--orange-dim:rgba(200,114,16,.12);
  --red:#d23b3b;--red-dim:rgba(210,59,59,.10);
  --ok:#1f9d63;--ok-dim:rgba(31,157,99,.18);
  --text:#15171c;--text-mid:#666c7a;--text-dim:#9aa0ad;
  --border:#e2e4ea;--btn:#ffffff;--btn-hover:#eef0f4;
  --radar-bg:#e9ebf0;--radar-grid:#c5cbd8;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 30px -18px rgba(16,18,26,.28);
  /* appended tokens; light inks darkened for sunlight */
  --dot:#d3d6de;--tint:rgba(21,23,28,.09);--tint-2:rgba(21,23,28,.16);--ok-ink:#146b43;--orange-ink:#8a4d0a;--red-ink:#a02828;
  --scrim:rgba(8,10,14,.55);--knob:#ffffff;--shadow-float:0 30px 80px rgba(16,18,26,.25);--shadow-knob:0 1px 2px rgba(16,18,26,.12);
}
html,body{background:var(--bg);}
body{color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--green);}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
::selection{background:var(--green-dim);}
/* icons */
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}

/* top bar (.top) */
header{display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:56px;
border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;min-width:0;}
.back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0;
border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);color:var(--text-mid);text-decoration:none;}
.back:active{background:var(--bg3);color:var(--text);}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;
letter-spacing:-.01em;color:var(--text);text-decoration:none;white-space:nowrap;}
/* duck in the inverted .mark tile (own fills: brand exception) */
.logo .duck{flex-shrink:0;width:28px;height:28px;padding:4px 3px;border-radius:9px;background:var(--text);}
/* page identity: .name-in weight, not an eyebrow */
.hdr-title,.header-mid{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:600;color:var(--text);}
.sec-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mid);}
.page-logo{display:none;}
/* .ha-chip; .usage = .stage-meta */
#conn,.usage{display:inline-flex;align-items:center;gap:7px;margin-left:auto;padding:5px 11px;white-space:nowrap;
font-size:12.5px;font-weight:500;color:var(--text-mid);border:1px solid var(--border);border-radius:99px;}
.usage{font-size:11px;padding:0;border:0;max-width:50%;overflow:hidden;text-overflow:ellipsis;display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;}
#conn-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);transition:background .4s,box-shadow .4s;flex-shrink:0;}
#conn-dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-dim);}
#conn-dot.err{background:var(--red);box-shadow:0 0 0 3px var(--red-dim);}
@media (max-width:400px){header{gap:6px;padding:8px 12px;}}
@media (max-width:350px){#conn span{display:none;}#conn{padding:5px 7px;}}

/* page, groups, cards */
main{padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px;}
section{display:flex;flex-direction:column;gap:10px;}
/* .sec-hdr = .group rule; off on the first section (first-of-type: cal starts with a callout) */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;
padding-top:16px;border-top:1px solid var(--border);}
section:first-of-type > .sec-hdr,main > .sec-hdr:first-child,.card > .sec-hdr{padding-top:0;border-top:0;}
/* header action = .mini at the 36px floor */
.sec-btn,#refresh-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 12px;
border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text-mid);
font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;}
.sec-btn:active,#refresh-btn:active{color:var(--text);border-color:var(--text-mid);}
.sec-btn svg.i,#refresh-btn svg.i{width:16px;height:16px;}
.card,.status-card,.upload-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px;}
/* .insp-empty; quiet inside a card (fs: #tree.tree) */
.empty,.card.empty{color:var(--text-mid);font-size:12.5px;line-height:1.45;text-align:center;padding:22px 12px;
border:1.5px dashed var(--border);border-radius:16px;background:transparent;}
.card > .empty,.card .tree > .empty{border:0;border-radius:0;padding:8px 0;}
.hint,.note,.cal-desc{font-size:12.5px;color:var(--text-mid);line-height:1.5;margin:0;}
.note,.cal-desc{margin-bottom:12px;}
/* .score strip */
.score{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--border);font-size:12.5px;line-height:1.45;}
.score b{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.val{font-family:var(--mono);font-size:12px;color:var(--text-mid);font-variant-numeric:tabular-nums;}
@keyframes pulse{50%{opacity:.25;transform:scale(.7);}}

/* .btn at touch density; danger = red text, never a red fill */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:10px 14px;
border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--btn);color:var(--text);
font-size:13px;font-weight:500;line-height:20px;cursor:pointer;text-decoration:none;white-space:nowrap;
transition:border-color .15s,background .15s;}
.btn:active{background:var(--btn-hover);border-color:var(--text-mid);}
.btn:disabled{opacity:.45;cursor:default;}
.btn-primary,.btn-green{background:var(--green);border-color:transparent;color:var(--accent-ink);}
.btn-primary:active,.btn-green:active{background:var(--green);border-color:transparent;filter:brightness(.94);}
.btn-danger,.btn-red{color:var(--red);}
.btn.icon{width:40px;min-height:40px;padding:0;}
.btn.sm{min-height:36px;padding:6px 12px;}
/* hover (laptops only) */
@media (hover:hover){
.btn:hover:not(:disabled),.sec-btn:hover,#refresh-btn:hover,.act-btn:hover,.entry-del:hover{border-color:var(--text-mid);}
.btn-primary:hover:not(:disabled),.btn-green:hover:not(:disabled){filter:brightness(1.06);}
}

/* fields: recessed, accent focus border (range/checkbox keep the ring) */
input[type=text],input[type=number],input[type=time],select,.throw-inp,.path-inp,.file-inp{
background:var(--bg);border:1px solid var(--border);border-radius:9px;
color:var(--text);font-size:15px;padding:10px 12px;min-height:42px;width:100%;}
input:not([type=range]):not([type=checkbox]):focus,select:focus{outline:none;border-color:var(--green);}
input::placeholder{color:var(--text-dim);}
input[type=range]{accent-color:var(--green);width:100%;height:36px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;font-weight:500;}
/* .name-in: border on hover; resting border on touch */
input.name-in,.name-in{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;min-height:0;min-width:0;font-weight:500;color:var(--text);}
input.name-in:hover{border-color:var(--border);}
input.name-in:focus{border-color:var(--green);outline:none;}
@media (hover:none){input.name-in{border-color:var(--border);}}

/* .switch 44x26; knob on .theme-slider:before; label :before pads the hit box to 56x44 */
.theme-switch{position:relative;display:inline-block;width:44px;height:26px;vertical-align:middle;flex-shrink:0;cursor:pointer;}
.theme-switch:before{content:"";position:absolute;inset:-9px -6px;}
.theme-switch input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;}
.theme-slider{position:absolute;inset:0;border-radius:99px;background:var(--border);transition:background .2s;pointer-events:none;}
.theme-slider:before{position:absolute;content:"";width:20px;height:20px;left:3px;top:3px;border-radius:50%;
background:var(--knob);box-shadow:var(--shadow-knob);transition:transform .2s;}
.theme-switch input:checked + .theme-slider{background:var(--green);}
.theme-switch input:checked + .theme-slider:before{transform:translateX(18px);}
.theme-switch input:focus-visible + .theme-slider{outline:2px solid var(--green);outline-offset:2px;}

/* .rep rows: panel fill, tint only on the 22px icon */
.banner{margin:12px 16px 0;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);
background:var(--bg2);font-size:13px;font-weight:500;line-height:1.45;color:var(--text);}
.banner-row{display:flex;gap:10px;align-items:flex-start;}
.banner-i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--green-dim);color:var(--green);}
.banner-i svg.i{width:14px;height:14px;}
.banner-body{flex:1;min-width:0;}
.banner-info .banner-i{background:var(--green-dim);color:var(--green);}
.banner-warn .banner-i{background:var(--orange-dim);color:var(--orange-ink);}
.banner .btn{margin-top:10px;}

/* winter lock (b535) */
body.winter-lock{pointer-events:none;}
body.winter-lock #winter-banner{pointer-events:auto;}
body.winter-lock button:not(#winter-banner button),body.winter-lock input,
body.winter-lock select,body.winter-lock a{opacity:.45;}
/* don't double-dim icons the head script already dimmed */
body.winter-lock button svg.i,body.winter-lock a svg.i{opacity:1;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

html,body{height:100%;overflow:hidden;}
body{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
header{padding:6px 12px;min-height:52px;}
.header-mid{text-align:center;}
/* stage: dotted canvas ground; the 12/16 padding is baked into resizeCanvas() */
#map-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 16px;min-height:0;position:relative;
background-image:radial-gradient(var(--dot) 1px,transparent 1.5px);background-size:18px 18px;}
#map{border-radius:50%;display:block;touch-action:none;box-shadow:var(--shadow);}
#heat-legend{display:none;flex-direction:column;align-items:flex-start;gap:4px;position:absolute;right:12px;top:50%;transform:translateY(-50%);}
.hl-bar{width:14px;border-radius:7px;border:1px solid var(--border);
background:linear-gradient(to bottom,rgba(255,90,40,.95) 0%,rgba(255,195,40,.9) 28%,rgba(63,182,198,.95) 52%,rgba(90,157,124,.9) 76%,rgba(60,140,255,.95) 100%);}
.hl-ticks{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text-mid);line-height:1.3;padding-left:4px;font-variant-numeric:tabular-nums;}
#hl-label{font-size:11px;font-weight:600;color:var(--text-mid);white-space:nowrap;margin-top:2px;padding:2px 7px;border-radius:99px;background:var(--bg2);border:1px solid var(--border);}
#hl-label:empty{display:none;}
/* control pane = panel on ground: #readout opens it with the 1px line, every strip below shares the fill */
#readout,#dpad-section,#secondary,#edit-bar,#name-row,#footer{background:var(--bg2);}
#readout{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex-shrink:0;padding:8px 16px 0;border-top:1px solid var(--border);}
.rcel{text-align:center;padding:6px;background:var(--tint);border-radius:12px;}
.rlabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mid);margin-bottom:4px;}
.rval{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap;}
/* d-pad = Hearth keypad tiles: press = darker tint, held = accent (the jogging "on" state), limit = orange tint. No scale. */
#dpad-section{flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:8px 16px 6px;}
#dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px;}
.dp{display:flex;align-items:center;justify-content:center;padding:0;background:var(--tint);border:1px solid transparent;
border-radius:14px;color:var(--text);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;
transition:background .1s,color .1s;}
.dp svg.i{width:22px;height:22px;}
.dp:active{background:var(--tint-2);}
.dp.held{background:var(--green);color:var(--accent-ink);}
.dp-empty{background:transparent;border:0;pointer-events:none;}
#btn-add{background:var(--green);color:var(--accent-ink);}
#btn-add svg.i{width:26px;height:26px;}
#btn-add:active{filter:brightness(.92);}
.dp.at-limit{background:var(--orange-dim);color:var(--orange-ink);}
.dp.at-limit:active,.dp.at-limit.held{background:var(--orange);color:var(--accent-ink);}
@media (max-height:640px){#dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);}.rcel{padding:5px 6px;}}
/* secondary row = Hearth .mnav: idle muted; on = accent text on the accent-tinted ground. The JS-inlined active
   state of #btn-path/#btn-heatmap (color + border-color accent) needs the 1px transparent border to stay. */
#secondary,#edit-bar{flex-shrink:0;display:flex;gap:4px;padding:0 12px 8px;}
.sbtn{flex:1;min-width:0;min-height:44px;padding:4px 2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);color:var(--text-mid);font-size:11px;font-weight:600;
cursor:pointer;white-space:nowrap;overflow:hidden;transition:background .15s,color .15s;}
.sbtn svg.i{width:20px;height:20px;}
.sbtn:active{background:var(--bg3);color:var(--text);}
#btn-water.on{background:var(--green-dim);color:var(--green);border-color:transparent;}
/* edit-mode toolbar: ordinary .btn shapes (danger / primary / plain); #edit-bar keeps its inline display:none */
#edit-bar .sbtn{flex-direction:row;gap:7px;min-height:42px;padding:8px 10px;font-size:13px;font-weight:500;color:var(--text);background:var(--bg2);border-color:var(--border);}
#edit-bar .sbtn svg.i{width:18px;height:18px;}
#edit-bar .sbtn:first-child{color:var(--red);}
#btn-edit-save{background:var(--green);color:var(--accent-ink);border-color:transparent;}
#btn-edit-save:disabled{opacity:.45;}
/* trim = Hearth .mini at the 36px floor; doTrim() rewrites textContent, so the glyph stays text */
#btn-trim{display:block;width:100%;margin-top:6px;min-height:36px;padding:6px 8px;font-size:12px;font-weight:500;background:var(--bg);
border:1px solid var(--border);border-radius:7px;color:var(--text-mid);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;}
#btn-trim:not(.water-off):active{color:var(--text);border-color:var(--text-mid);background:var(--bg3);}
#btn-trim.water-off{opacity:.45;cursor:default;}
#btn-trim.busy{opacity:.6;pointer-events:none;}
/* name row: eyebrow label + recessed field (a required input keeps the field look at rest) */
#name-row{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:2px 16px;}
#name-row label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-mid);white-space:nowrap;}
#zone-name{flex:1;width:auto;min-height:40px;padding:6px 10px;font-size:16px;font-weight:600;}
#zone-name::placeholder{color:var(--text-mid);}
/* footer: .btn + .btn.primary at touch height; Save stays flex:2 */
#footer{flex-shrink:0;display:flex;gap:8px;padding:6px 16px calc(8px + env(safe-area-inset-bottom,0px));}
#btn-cancel{flex:1;min-height:46px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;}
#btn-cancel:active{background:var(--bg3);}

</style>

<body>

<script>
// ── Canvas ──────────────────────────────────────────────────────
const CV = document.getElementById('map');
const ctx = CV.getContext('2d');
let ST = {bearing:0, throw_mm:4267, throw_ft:14, pressure_pct:50, water:false, points:[], act_max_throw:10058, act_min_throw:0};
// b400: on-device point editor state. _cx/_cy/_maxR are captured each draw() so
// the canvas pointer handlers can hit-test / invert the projection.
let _editMode=false, _selPt=-1, _dragging=false, _cx=0, _cy=0, _maxR=1;
// Display scale (mm at canvas rim): device's reported max throw (calibrated
// reach, or live throw if pressure exceeds the cal table) + 3ft (914mm) buffer.
// Tracks calibration, so the radar stays correctly scaled at any water pressure.
function _edScale(){ return (ST.act_max_throw||10058) + 914; }
const TRAIL_MAX = 120;
let waterTrail = [];
let lastWaterBearing = null;
let showPath = false;
let heatPasses = 0;
let lastRun = null;
let waterCSVRows = null;
const _zoneIdParam = new URLSearchParams(window.location.search).get('id')||'0';
fetch('/zone/last_water?id='+_zoneIdParam).then(r=>r.json()).then(d=>{
  if(d.num_rings>0){lastRun=d; if(heatPasses===2) draw();}
}).catch(()=>{});
(function loadCSV(){
  fetch('/zone/water_csv?id='+_zoneIdParam).then(r=>{
    if(!r.ok) throw new Error('csv '+r.status);
    return r.text();
  }).then(txt=>{
    const lines=txt.trim().split('\n');
    if(lines.length<2){waterCSVRows=[];if(heatPasses===2)draw();return;}
    const hdr=lines[0].split(',');
    const idx=k=>hdr.indexOf(k);
    if(idx('nozzle_deg_actual')<0){waterCSVRows=[];if(heatPasses===2)draw();return;}
    waterCSVRows=lines.slice(1).map(l=>{
      const c=l.split(',');
      const pt=+c[idx('pass_type')];
      return {ring:+c[idx('ring')],sector:+c[idx('sector')],
              actDeg:+c[idx('nozzle_deg_actual')],tgtDeg:+c[idx('nozzle_deg_target')],
              actMm:+c[idx('throw_mm_actual')],tgtMm:+c[idx('throw_mm_target')],
              psiAct:+c[idx('pressure_psi_actual')],psiTgt:+c[idx('pressure_psi_target')],
              passType:pt,
              // Aggregate records (passType=255): time_s encodes total depth_mm × 10
              totalDepth: pt===255 ? +c[idx('time_s')]/10 : 0};
    }).filter(r=>r.actMm>100);
    if(heatPasses===2) draw();
  }).catch(e=>{console.warn('CSV load failed:',e);waterCSVRows=[];if(heatPasses===2)draw();});
})();

function togglePath(){
  showPath = !showPath;
  const btn = document.getElementById('btn-path');
  btn.style.color = showPath ? 'var(--green)' : '';
  btn.style.borderColor = showPath ? 'var(--green)' : '';
  draw();
}

function toggleHeatmap(){
  heatPasses = (heatPasses + 1) % 3;
  const btn = document.getElementById('btn-heatmap');
  btn.innerHTML = ['<svg class="i"><use href="#i-thermometer"/></svg>Depth','<svg class="i"><use href="#i-thermometer"/></svg>Predict','<svg class="i"><use href="#i-thermometer"/></svg>Actual'][heatPasses];
  btn.style.color = heatPasses ? 'var(--green)' : '';
  btn.style.borderColor = heatPasses ? 'var(--green)' : '';
  const leg=document.getElementById('heat-legend');
  const hlLbl=document.getElementById('hl-label');
  if(heatPasses>0){
    leg.style.display='flex';
    hlLbl.textContent=heatPasses===2?'actual run':'predicted';
  } else {
    leg.style.display='none';
  }
  resizeCanvas();
}

// Canvas paints literal colours, so the draw functions resolve the same tokens
// the stylesheet uses. Alpha rides along as the #RRGGBBAA suffix.
function PAL(){
  const c=getComputedStyle(document.documentElement), g=(n,f)=>c.getPropertyValue(n).trim()||f;
  return {grid:g('--radar-grid','#272c38'), mid:g('--text-mid','#8c92a1'),
          dim: g('--text-dim','#4d5461'),   accent:g('--green','#8a94ff'),
          mark:g('--orange','#ff9f40'),     ink:g('--accent-ink','#0e1014')};
}
function drawHeatMap(W, H, cx, cy, maxR) {
  const P=PAL();
  if (!heatPasses || ST.points.length < 3) return;
  const passes = heatPasses;

  // Walk-order sorted polygon for pip test
  const wpts=[...ST.points].sort((a,b)=>((a.widx??99)-(b.widx??99))||a.deg-b.deg);
  function pip(bearing, r_mm) {
    const px=r_mm*Math.sin(bearing*Math.PI/180), py=r_mm*Math.cos(bearing*Math.PI/180);
    let c=0;
    for(let i=0;i<wpts.length;i++){
      const j=(i+1)%wpts.length,pi=wpts[i],pj=wpts[j];
      const x1=pi.throw_mm*Math.sin(pi.deg*Math.PI/180)-px,y1=pi.throw_mm*Math.cos(pi.deg*Math.PI/180)-py;
      const x2=pj.throw_mm*Math.sin(pj.deg*Math.PI/180)-px,y2=pj.throw_mm*Math.cos(pj.deg*Math.PI/180)-py;
      if((y1>0)!==(y2>0)){const t=y1/(y1-y2);if(x1+t*(x2-x1)>0)c++;}
    }
    return c%2===1;
  }

  // Zone arc bounds
  const sdegs=ST.points.map(p=>p.deg).sort((a,b)=>a-b);
  let mg=0,gi=0;
  for(let i=0;i<sdegs.length;i++){const nxt=i<sdegs.length-1?sdegs[i+1]:sdegs[0]+360;if(nxt-sdegs[i]>mg){mg=nxt-sdegs[i];gi=i;}}
  let arcStart=sdegs[(gi+1)%sdegs.length];
  let arcSpan=((sdegs[gi]-arcStart+360)%360)||360;
  // Max ray-polygon intersection distance at a bearing (firmware ray cast).
  function rayMaxMm(bearing){
    const bs=Math.sin(bearing*Math.PI/180),bc=Math.cos(bearing*Math.PI/180);
    let best=0;
    for(let i=0;i<wpts.length;i++){
      const j=(i+1)%wpts.length,pi=wpts[i],pj=wpts[j];
      const x1=pi.throw_mm*Math.sin(pi.deg*Math.PI/180),y1=pi.throw_mm*Math.cos(pi.deg*Math.PI/180);
      const x2=pj.throw_mm*Math.sin(pj.deg*Math.PI/180),y2=pj.throw_mm*Math.cos(pj.deg*Math.PI/180);
      const dx=x2-x1,dy=y2-y1,det=bc*dx-bs*dy;
      if(Math.abs(det)<1e-6)continue;
      const s=(dx*y1-dy*x1)/det,u=(bs*y1-bc*x1)/det;
      if(s>0.5&&u>=0&&u<=1&&s>best)best=s;
    }
    return best;
  }
  // b435: only honor the bearing-gap window if the gap is genuinely empty
  // space. One long straight boundary edge can span a wide vertex-bearing
  // gap (real zone area, not a wedge back side) -- mirrors firmware
  // zone_gap_is_empty: probe 3 bearings inside the gap for waterable extent.
  if(arcSpan<360&&mg>0){
    let spanned=false;
    for(let k=1;k<=3;k++)if(rayMaxMm((sdegs[gi]+mg*k/4)%360)>=461)spanned=true;
    if(spanned){arcStart=0;arcSpan=360;}
  }

  // Ring generation (mirrors firmware)
  const actMax=ST.act_max_throw||10058;
  const actMin=(ST.act_min_throw&&ST.act_min_throw>50)?ST.act_min_throw:Math.min(...ST.points.map(p=>p.throw_mm));
  const zoneMax=Math.max(...ST.points.map(p=>p.throw_mm));
  const zoneThrowMin=Math.min(...ST.points.map(p=>p.throw_mm));
  // Sprinkler-in-center: all walk points at same throw => gap in path is not an exclusion
  const sprinklerInCenter=zoneMax>0&&(zoneMax-zoneThrowMin)/zoneMax<0.05;
  if(sprinklerInCenter){arcStart=0;arcSpan=360;}
  // pip(0,1): test 1mm north — if true, sprinkler is inside the polygon.
  // Force 360 deg arc so coverage is polygon-clipped, not bearing-gap-clipped.
  // (The gap-detection arc is wrong when the sprinkler is inside the polygon.)
  const originInside=pip(0,1);
  if(!sprinklerInCenter&&originInside){arcStart=0;arcSpan=360;}
  const rings=[];let t=zoneMax;
  while(t>=actMin&&rings.length<36){rings.push(t);t-=Math.max(700*(t/actMax),80);}
  if(!rings.length)return;
  // Inner rings below actMin for sprinkler-inside-polygon zones.
  const WATER_MIN_THROW_JS=461;
  const innerRingStart=rings.length;
  if(!sprinklerInCenter&&originInside&&actMin>WATER_MIN_THROW_JS){
    while(t>WATER_MIN_THROW_JS&&rings.length<36){rings.push(t);t-=Math.max(700*(t/actMax),80);}
  }

  const MIN_ELLIPSE=1829, SPLASH_R=300, STEP=1.0;

  function dcolor(ratio){
    if(ratio<0.6)  return 'rgba(60,140,255,0.55)';
    if(ratio<0.88) return 'rgba(60,200,180,0.55)';
    if(ratio<1.12) return 'rgba(40,210,80,0.65)';
    if(ratio<1.5)  return 'rgba(255,195,40,0.65)';
    return               'rgba(255,90,40,0.65)';
  }

  rings.forEach((rt,ri)=>{
    let rO,rI;
    if(rt<MIN_ELLIPSE){rO=rt+SPLASH_R;rI=Math.max(0,rt-SPLASH_R);}
    else{rO=ri===0?rt:(rings[ri-1]+rt)/2;rI=ri===rings.length-1?(ri>=innerRingStart?WATER_MIN_THROW_JS:actMin):(rt+rings[ri+1])/2;}
    const rOPx=rO/_edScale()*maxR, rIPx=Math.max(0,rI/_edScale()*maxR);
    if(rOPx<=rIPx+0.5)return;

    // Count active sectors (10-deg steps = WATER_SECTOR_DEG)
    let activeSectors=0;
    for(let o=0;o<=arcSpan;o+=10)if(pip((arcStart+o)%360,rt))activeSectors++;
    if(activeSectors<1)return;
    const arcFrac=activeSectors/36;

    const rO_m=rO/1000,rI_m=rI/1000,r_m=rt/1000;
    const areaPerDeg=r_m*(Math.PI/180)*(rO_m-rI_m);
    let depth,targetDepth;
    if (passes===2) {
      return;  // actual mode handled separately below
    } else {
      // Predicted: firmware model (pressPct from ring_throw/actMax)
      targetDepth=3.175*passes;
      const pressPct=rt/actMax*100;
      const flowLpm=0.12*pressPct+1.0;
      const area_m2=Math.PI*(rO_m*rO_m-rI_m*rI_m)*arcFrac;
      const timeMins=targetDepth*area_m2/flowLpm;
      const dps=(activeSectors*10)/(timeMins*60);
      depth=(flowLpm/60/1000)/Math.max(dps,0.01)/areaPerDeg*1000;
    }
    const col=dcolor(depth/targetDepth);

    // Draw polygon-clipped arc using pip sweep (handles complex zone shapes)
    {
      const HSTEP=1.5;const hspans=[];let hss=null;
      for(let o=0;o<=arcSpan+HSTEP;o+=HSTEP){
        const ins=pip((arcStart+o)%360,rt);
        if(ins&&hss===null)hss=o;
        if(!ins&&hss!==null){hspans.push({lo:(arcStart+hss+360)%360,sp:o-hss});hss=null;}
      }
      if(hss!==null)hspans.push({lo:(arcStart+hss+360)%360,sp:arcSpan-hss});
      hspans.forEach(hs=>{
        // b501: skip degenerate spans. The sweep tests bearing 0 and 360
        // twice (the +HSTEP overshoot closes wrap runs), so an inside-run
        // that STARTS on the final duplicated iterations yields a trailing
        // span of zero/negative width (sp = arcSpan - hss <= 0). The
        // he<=hl wrap adjustment below then promoted exactly those spans
        // to FULL 360-degree annuli -- Combined's north-corner sliver at
        // bearing ~0 painted every such ring as a complete circle in
        // Predict, which the firmware never waters.
        if(hs.sp<=0.01)return;
        let he=(hs.lo+hs.sp-90)*Math.PI/180;
        const hl=(hs.lo-90)*Math.PI/180;
        if(he<=hl)he+=2*Math.PI;
        ctx.beginPath();ctx.arc(cx,cy,rOPx,hl,he);ctx.arc(cx,cy,rIPx,he,hl,true);
        ctx.closePath();ctx.fillStyle=col;ctx.fill();
      });
    }

    // Depth label if band wide enough and mid-arc is inside zone
    if(rOPx-rIPx>11){
      const mb=(arcStart+arcSpan*0.5)%360;
      if(pip(mb,(rO+rI)/2)){
        const mr=(rO+rI)/2/_edScale()*maxR, ma=(mb-90)*Math.PI/180;
        ctx.font='8px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='rgba(255,255,255,0.80)';
        ctx.fillText(depth.toFixed(1),cx+Math.cos(ma)*mr,cy+Math.sin(ma)*mr);
      }
    }
  });

  // ---- Actual-mode rendering: cell-based from CSV measurements ----
  // Each CSV row is drawn as an individual sector patch at the actual
  // nozzle bearing x actual throw, colored by actual water depth.
  // This shows spatial variation in both bearing offset and throw error.
  if (passes===2) {
    if (!lastRun) {
      ctx.save();
      ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=P.mid;
      ctx.fillText('No watering data yet',cx,cy-14);
      ctx.font='11px sans-serif';ctx.fillStyle=P.dim;
      ctx.fillText('Run a watering cycle first',cx,cy+6);
      ctx.restore(); return;
    }
    if (waterCSVRows === null) {
      ctx.save();
      ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=P.mid;
      ctx.fillText('Loading watering data...',cx,cy);
      ctx.restore(); return;
    }
    if (!waterCSVRows.length) {
      ctx.save();
      ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=P.mid;
      ctx.fillText('No CSV data -- water zone to generate',cx,cy);
      ctx.restore(); return;
    }
    try {
    const LR = lastRun.rings;
    const SECTOR_DEG = 10;
    const targetDepth = 3.175; // mm (1/8 inch per pass)

    // Build sorted list of ring average throws from CSV for radial bounds
    const ringThrowMap = {};
    waterCSVRows.forEach(r=>{
      if(!ringThrowMap[r.ring]) ringThrowMap[r.ring]={sum:0,n:0};
      ringThrowMap[r.ring].sum += r.actMm;
      ringThrowMap[r.ring].n++;
    });
    const sortedRings = Object.keys(ringThrowMap).map(Number).sort((a,b)=>a-b);
    const ringAvgMm = {};
    sortedRings.forEach(r=>{ ringAvgMm[r]=ringThrowMap[r].sum/ringThrowMap[r].n; });

    // Rasterize each measurement as an exact annular sector onto the depth buffer.
    // No Gaussian splat = no angular over-counting. CW + CCW passes that land
    // on the same pixel genuinely accumulate (double coverage = double depth).
    const LOG_DEG = 2.0;
    const BW=Math.round(W), BH=Math.round(H);
    const depthBuf = new Float32Array(BW*BH);

    waterCSVRows.forEach(row=>{
      const {ring, actDeg, actMm, psiAct, passType, totalDepth} = row;
      const isAggr = passType===255;
      // Aggregate records cover a full 10° sector and carry pre-computed total depth.
      // Per-pass records cover a 2° sample and derive depth from flow model.
      const patchDeg = isAggr ? 10.0 : LOG_DEG;
      const ri = sortedRings.indexOf(ring);
      const rawO = ri===0 ? actMm*1.08 : (ringAvgMm[sortedRings[ri-1]]+actMm)/2;
      const rawI = ri===sortedRings.length-1 ? actMm*0.92 : (actMm+ringAvgMm[sortedRings[ri+1]])/2;
      let depth;
      if (isAggr) {
        depth = totalDepth;  // stored directly as mm of water across all passes
      } else {
        const dps = (LR && LR[ring-1] && LR[ring-1].dps) ? LR[ring-1].dps : 1.0;
        const flowLpm = 0.12*(psiAct/5.034*100)+1.0;
        const r_m=actMm/1000, dr_m=(rawO-rawI)/1000;
        const area_m2 = Math.PI*((r_m+dr_m/2)**2-(r_m-dr_m/2)**2)*(LOG_DEG/360);
        depth = (flowLpm/60/1000)*(LOG_DEG/dps)/Math.max(area_m2,1e-6)*1000;
      }

      // Sector bearing span
      const bearLo = actDeg - patchDeg/2;
      const bearHi = actDeg + patchDeg/2;
      const rOPx = rawO/_edScale()*maxR, rIPx = Math.max(0, rawI/_edScale()*maxR);

      // Tight bounding box around this sector
      const cRad = (actDeg-90)*Math.PI/180;
      const midRPx = (rOPx+rIPx)/2;
      const halfRad = (rOPx-rIPx)/2 + 2;
      const halfAng = rIPx*Math.sin(patchDeg/2*Math.PI/180) + 2;
      const bcx=cx+midRPx*Math.cos(cRad), bcy=cy+midRPx*Math.sin(cRad);
      const box=halfRad+halfAng;
      const x0=Math.max(0,Math.floor(bcx-box)), x1=Math.min(BW-1,Math.ceil(bcx+box));
      const y0=Math.max(0,Math.floor(bcy-box)), y1=Math.min(BH-1,Math.ceil(bcy+box));

      for(let px2=x0;px2<=x1;px2++){
        for(let py2=y0;py2<=y1;py2++){
          const dx=px2-cx, dy=py2-cy;
          const r2=Math.sqrt(dx*dx+dy*dy);
          if(r2<rIPx||r2>rOPx) continue;
          const bear=((Math.atan2(dx,-dy)*180/Math.PI)+360)%360;
          let inSec;
          if(bearHi>=360) inSec=bear>=bearLo||bear<=bearHi-360;
          else if(bearLo<0) inSec=bear>=bearLo+360||bear<=bearHi;
          else inSec=bear>=bearLo&&bear<=bearHi;
          if(inSec) depthBuf[py2*BW+px2]+=depth;
        }
      }
    });

    // Color-map accumulated depth buffer and blit onto canvas
    const imgData=ctx.createImageData(BW,BH);
    const d32=imgData.data;
    for(let i=0;i<BW*BH;i++){
      const dep=depthBuf[i];
      if(dep<0.005) continue;
      const ratio=dep/targetDepth;
      // Color ramp: blue(<0.6) teal(0.6-0.88) green(0.88-1.12) amber(1.12-1.5) red(>1.5)
      let r=0,g=0,b2=0,a=0;
      if(ratio<0.60){r=40;g=90+Math.round(ratio/0.60*80);b2=200;a=Math.round(ratio/0.60*200);}
      else if(ratio<0.88){const t=(ratio-0.60)/0.28;r=40;g=170+Math.round(t*50);b2=Math.round(200*(1-t));a=200;}
      else if(ratio<1.12){const t=(ratio-0.88)/0.24;r=Math.round(40+t*120);g=220;b2=0;a=220;}
      else if(ratio<1.50){const t=(ratio-1.12)/0.38;r=160+Math.round(t*80);g=Math.round(220*(1-t*0.5));b2=0;a=230;}
      else{r=240;g=Math.max(0,80-Math.round((ratio-1.5)*40));b2=0;a=240;}
      const base=i*4;
      d32[base]=r; d32[base+1]=g; d32[base+2]=b2; d32[base+3]=Math.min(255,a);
    }
    // Render to temp canvas then blur onto main canvas for organic spread.
    // The sector rasterization gives accurate depth; blur represents physical
    // spray spread (elliptical at each pause, smear while moving).
    const tmpC = document.createElement('canvas');
    tmpC.width = BW; tmpC.height = BH;
    tmpC.getContext('2d').putImageData(imgData, 0, 0);
    ctx.save();
    ctx.filter = 'blur(3px)';
    ctx.drawImage(tmpC, 0, 0);
    ctx.restore();

    // Redraw zone polygon outline on top so boundary is always visible
    if(ST.points.length>=3){
      const pts=ST.points;
      ctx.save();
      ctx.beginPath();
      pts.forEach((p,i)=>{
        const r=p.throw_mm/_edScale()*maxR;
        const a=(p.deg-90)*Math.PI/180;
        i?ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)
          :ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
      });
      ctx.closePath();
      ctx.strokeStyle=P.accent+'99';
      ctx.lineWidth=1.5;
      ctx.stroke();
      ctx.restore();
    }

    // Legend -- gradient bar with depth labels
    return;
  } catch(e){ console.error('Actual heatmap error:',e); } }

}

function drawPath(W, H, cx, cy, maxR) {
  if (ST.points.length < 2) return;
  function pointInZone(bearing, r_mm) {
    const px=r_mm*Math.sin(bearing*Math.PI/180),py=r_mm*Math.cos(bearing*Math.PI/180);
    let crosses=0;
    const n=ST.points.length;
    for(let i=0;i<n;i++){
      const j=(i+1)%n,pi=ST.points[i],pj=ST.points[j];
      const x1=pi.throw_mm*Math.sin(pi.deg*Math.PI/180)-px,y1=pi.throw_mm*Math.cos(pi.deg*Math.PI/180)-py;
      const x2=pj.throw_mm*Math.sin(pj.deg*Math.PI/180)-px,y2=pj.throw_mm*Math.cos(pj.deg*Math.PI/180)-py;
      if((y1>0)!==(y2>0)){const t=y1/(y1-y2);if(x1+t*(x2-x1)>0)crosses++;}
    }
    return(crosses%2===1);
  }
  const sdegs=ST.points.map(p=>p.deg).sort((a,b)=>a-b);
  let mg=0,gi=0;
  for(let i=0;i<sdegs.length;i++){const n=i<sdegs.length-1?sdegs[i+1]:sdegs[0]+360;if(n-sdegs[i]>mg){mg=n-sdegs[i];gi=i;}}
  let arcStart=sdegs[(gi+1)%sdegs.length],arcEnd=sdegs[gi];
  let arcSpan=((arcEnd-arcStart+360)%360)||360;
  const actMax=ST.act_max_throw||10058;
  const zoneMax=Math.max(...ST.points.map(p=>p.throw_mm));
  const zoneMin=(ST.act_min_throw&&ST.act_min_throw>50)?ST.act_min_throw:Math.min(...ST.points.map(p=>p.throw_mm));
  const zoneThrowMin2=Math.min(...ST.points.map(p=>p.throw_mm));
  // Sprinkler-in-center: all walk points at same throw => gap is not an exclusion
  const pathSIC=zoneMax>0&&(zoneMax-zoneThrowMin2)/zoneMax<0.05;
  if(pathSIC){arcStart=0;arcSpan=360;}
  // Origin-inside-polygon: force 360 deg arc so polygon boundary clips coverage
  const pathOriginInside=pointInZone(0,1);
  if(!pathSIC&&pathOriginInside){arcStart=0;arcSpan=360;}
  // b435: spanned-gap guard (see drawHeatMap) -- a long straight edge can
  // span the largest vertex-bearing gap; don't window it out of the path.
  if(arcSpan<360&&mg>0){
    let spanned=false;
    for(let k=1;k<=3;k++){
      const gb=(sdegs[gi]+mg*k/4)%360;
      const gbs=Math.sin(gb*Math.PI/180),gbc=Math.cos(gb*Math.PI/180);
      let best=0;
      for(let i=0;i<ST.points.length;i++){
        const j=(i+1)%ST.points.length,pi=ST.points[i],pj=ST.points[j];
        const x1=pi.throw_mm*Math.sin(pi.deg*Math.PI/180),y1=pi.throw_mm*Math.cos(pi.deg*Math.PI/180);
        const x2=pj.throw_mm*Math.sin(pj.deg*Math.PI/180),y2=pj.throw_mm*Math.cos(pj.deg*Math.PI/180);
        const dx=x2-x1,dy=y2-y1,det=gbc*dx-gbs*dy;
        if(Math.abs(det)<1e-6)continue;
        const s=(dx*y1-dy*x1)/det,u=(gbs*y1-gbc*x1)/det;
        if(s>0.5&&u>=0&&u<=1&&s>best)best=s;
      }
      if(best>=461)spanned=true;
    }
    if(spanned){arcStart=0;arcSpan=360;}
  }
  const rings=[];let t=zoneMax;
  while(t>=zoneMin&&rings.length<36){rings.push(t);t-=Math.max(700*(t/actMax),80);}
  if(!rings.length)return;
  // Inner rings below zoneMin for sprinkler-inside-polygon zones
  if(!pathSIC&&pathOriginInside&&zoneMin>461){
    while(t>461&&rings.length<36){rings.push(t);t-=Math.max(700*(t/actMax),80);}
  }
  const STEP=0.5;
  for(let ri=0;ri<rings.length;ri++){
    const thr=rings[ri],r=(thr/_edScale())*maxR;
    const cw=(ri%2===0),al=0.70-0.30*(ri/(rings.length-1||1));
    const spans=[];let spanStart=null;
    for(let o=0;o<=arcSpan+STEP;o+=STEP){
      const bearing=(arcStart+o)%360,inside=pointInZone(bearing,thr);
      if(inside&&spanStart===null)spanStart=o;
      if(!inside&&spanStart!==null){spans.push({lo:(arcStart+spanStart+360)%360,span:o-spanStart});spanStart=null;}
    }
    if(spanStart!==null)spans.push({lo:(arcStart+spanStart+360)%360,span:arcSpan-spanStart});
    for(const {lo,span} of spans){
      if(span<0.5)continue;
      const sa=(lo-90)*Math.PI/180;
      ctx.beginPath();ctx.arc(cx,cy,r,sa,sa+span*Math.PI/180,false);
      ctx.strokeStyle=cw?'rgba(80,180,255,'+al+')':'rgba(255,160,60,'+al+')';
      ctx.lineWidth=1.5;ctx.setLineDash([]);ctx.stroke();
    }
  }
}

function resizeCanvas(){
  const wrap = document.getElementById('map-wrap');
  const sz = Math.min(wrap.clientWidth - 32, wrap.clientHeight - 16, 330) | 0;
  if(CV.width !== sz){ CV.width = sz; CV.height = sz; }
  draw();
}

function draw(){
  const W = CV.width, H = CV.height, cx = W>>1, cy = H>>1;
  const maxR = cx - 4;
  _cx=cx; _cy=cy; _maxR=maxR;   // b400: for the point-editor hit-test/drag

  ctx.clearRect(0,0,W,H);

  // Background — solid fill from the CSS --radar-bg variable so the
  // radar matches the landing-page thumbnails and follows the theme.
  // Only the inside of the outermost circle is filled; the corners
  // stay transparent and show the page bg.
  const radarBg = getComputedStyle(document.documentElement)
                  .getPropertyValue('--radar-bg').trim() || '#0a0c0f';
  ctx.beginPath(); ctx.arc(cx,cy,maxR,0,Math.PI*2);
  ctx.fillStyle = radarBg; ctx.fill();

  // Range rings + labels. Rings are stroked in --radar-grid (theme-
  // tuned to sit just barely above the radar bg). Labels use
  // --text-mid (more legible) with the foot symbol "5'" / "10'".
  const css        = getComputedStyle(document.documentElement);
  const ringColor  = css.getPropertyValue('--radar-grid').trim() || '#272c38';
  const labelColor = css.getPropertyValue('--text-mid').trim() || '#8c92a1';
  const accentCol  = css.getPropertyValue('--green').trim()      || '#8a94ff';
  const markCol    = css.getPropertyValue('--orange').trim()     || '#ff9f40';
  const inkCol     = css.getPropertyValue('--accent-ink').trim() || '#0e1014';
  ctx.strokeStyle = ringColor;
  ctx.lineWidth   = 0.7;
  // Range rings + labels — tick list derived from the domain so the grid
  // adapts to any calibrated max throw (and thus any supply pressure).
  const _maxFt = (ST.act_max_throw||10058)/304.8;
  const _step  = _maxFt > 40 ? 10 : 5;
  const _ft = [];
  for(let f=_step; f<=_maxFt+0.01; f+=_step) _ft.push(f);
  _ft.forEach(ft => {
    const r = (ft*304.8/_edScale()) * maxR;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
  });
  ctx.fillStyle  = labelColor;
  ctx.font       = '9px "Courier New",monospace';
  ctx.textAlign  = 'left';
  ctx.textBaseline = 'middle';
  _ft.forEach(ft => {
    const r = (ft*304.8/_edScale()) * maxR;
    ctx.fillText(ft + "'", cx + r + 3, cy - 5);
  });

  // Zone polygon
  if(ST.points.length >= 2){
    ctx.beginPath();
    ST.points.forEach((p,i)=>{
      const rr=(p.throw_mm/_edScale())*maxR;
      const rad=(p.deg-90)*Math.PI/180;
      i===0 ? ctx.moveTo(cx+Math.cos(rad)*rr, cy+Math.sin(rad)*rr)
            : ctx.lineTo(cx+Math.cos(rad)*rr, cy+Math.sin(rad)*rr);
    });
    ctx.closePath();
    ctx.fillStyle=markCol+'17'; ctx.fill();
    ctx.strokeStyle=markCol+'8C'; ctx.lineWidth=1.5; ctx.stroke();
  }

  // Current throw ring (dashed)
  const throwR=(ST.throw_mm/_edScale())*maxR;
  ctx.beginPath(); ctx.arc(cx,cy,throwR,0,Math.PI*2);
  ctx.strokeStyle=accentCol+'1F'; ctx.lineWidth=1;
  ctx.setLineDash([3,5]); ctx.stroke(); ctx.setLineDash([]);

  // Overlays (drawn before nozzle line so line stays on top)
  drawHeatMap(W, H, cx, cy, maxR);
  if (showPath) drawPath(W, H, cx, cy, maxR);

  // Water trail dots
  const actualThrowMm = ST.actual_throw_mm || 0;
  if (waterTrail.length > 1) {
    for (let i = 0; i < waterTrail.length; i++) {
      const age = i / waterTrail.length;
      const tr = (waterTrail[i].r/_edScale())*maxR;
      const tbrad = (waterTrail[i].b - 90)*Math.PI/180;
      ctx.beginPath(); ctx.arc(cx+Math.cos(tbrad)*tr, cy+Math.sin(tbrad)*tr, 2.5, 0, Math.PI*2);
      ctx.fillStyle=accentCol+Math.round(age*0.55*255).toString(16).padStart(2,'0'); ctx.fill();
    }
  }

  // Nozzle bearing line
  const brad=(ST.bearing-90)*Math.PI/180;
  const bx=cx+Math.cos(brad)*maxR, by=cy+Math.sin(brad)*maxR;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(bx,by);
  ctx.strokeStyle=accentCol+'8C'; ctx.lineWidth=1.5;
  ctx.shadowBlur=14; ctx.shadowColor=accentCol; ctx.stroke(); ctx.shadowBlur=0;

  // Throw indicator dot — at actual throw when valve open, else slider position
  const actualThrowR = actualThrowMm > 100 ? (actualThrowMm/_edScale())*maxR : throwR;
  const dotIsActual = actualThrowMm > 100;
  const tx=cx+Math.cos(brad)*actualThrowR, ty=cy+Math.sin(brad)*actualThrowR;
  ctx.beginPath(); ctx.arc(tx,ty,5.5,0,Math.PI*2);
  ctx.fillStyle = dotIsActual ? accentCol : accentCol+'80';
  ctx.shadowBlur = dotIsActual ? 22 : 18;
  ctx.shadowColor=accentCol; ctx.fill(); ctx.shadowBlur=0;
  if (dotIsActual) {
    ctx.beginPath(); ctx.arc(tx,ty,9,0,Math.PI*2);
    ctx.strokeStyle=accentCol+'59'; ctx.lineWidth=1.5; ctx.stroke();
  }

  // Perimeter points
  ST.points.forEach((p,i)=>{
    const rr=(p.throw_mm/_edScale())*maxR;
    const rad=(p.deg-90)*Math.PI/180;
    const x=cx+Math.cos(rad)*rr, y=cy+Math.sin(rad)*rr;
    const sel=(_editMode && i===_selPt);           // b400: highlight selected pt
    ctx.beginPath(); ctx.arc(x,y, sel?8:(_editMode?6:5), 0,Math.PI*2);
    ctx.fillStyle = sel ? accentCol : markCol;
    ctx.shadowBlur = sel?16:10; ctx.shadowColor = sel?accentCol:markCol;
    ctx.fill(); ctx.shadowBlur=0;
    // Point index number
    ctx.fillStyle=inkCol;
    ctx.font='bold 8px -apple-system,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(i+1, x, y);
  });

  // Sprinkler
  ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2);
  ctx.fillStyle='#ffd700';
  ctx.shadowBlur=18; ctx.shadowColor='#ffd700'; ctx.fill(); ctx.shadowBlur=0;
  ctx.beginPath(); ctx.arc(cx,cy,2.5,0,Math.PI*2);
  ctx.fillStyle='#0e1014'; ctx.fill();
}

// ── State update ────────────────────────────────────────────────
function applyState(s){
  // Record water trail from actual throw
  const athr = s.actual_throw_mm || 0;
  if (athr > 100) {
    if (lastWaterBearing === null || Math.abs(s.bearing - lastWaterBearing) > 1.5) {
      waterTrail.push({b: s.bearing, r: athr});
      if (waterTrail.length > TRAIL_MAX) waterTrail.shift();
      lastWaterBearing = s.bearing;
    }
  } else {
    if (waterTrail.length > 0) waterTrail = [];
    lastWaterBearing = null;
  }
  if (s.act_max_throw !== undefined) s.act_max_throw = s.act_max_throw;
  if (s.act_min_throw !== undefined) s.act_min_throw = s.act_min_throw;
  ST=s;
  // Populate name field on first load (don't overwrite while user is typing)
  const nameEl=document.getElementById('zone-name');
  if(s.name && nameEl !== document.activeElement && !nameEl.dataset.edited)
    nameEl.value=s.name;
  document.getElementById('v-bearing').textContent=s.bearing.toFixed(1)+'°';
  document.getElementById('v-points').textContent=s.points.length+' / 36';
  document.getElementById('btn-water').classList.toggle('on',s.water);
  document.getElementById('btn-save').disabled=(s.points.length<3);
  document.getElementById('btn-dn').classList.toggle('at-limit', !!s.at_min);
  document.getElementById('btn-up').classList.toggle('at-limit', !!s.at_max);
  const limHint = s.at_min ? ' MIN' : s.at_max ? ' MAX' : '';
  document.getElementById('v-throw').textContent = s.throw_ft.toFixed(1)+'ft'+limHint;
  document.getElementById('btn-trim').classList.toggle('water-off', !s.water);
  draw();
}

// ── API ─────────────────────────────────────────────────────────
async function doTrim(){
  if(!ST.water) return;  // guard: only trim when water is on
  const btn = document.getElementById("btn-trim");
  btn.classList.add("busy");
  btn.textContent = "⊙ trimming...";
  try{
    const r=await fetch("/zone/act?cmd=trim_pres",{method:"POST"});
    if(!r.ok) throw new Error(r.status);
    applyState(await r.json());
    setConn(true);
    toast("Trimmed ✓");
  }catch(e){ setConn(false); }
  btn.classList.remove("busy");
  btn.textContent = "⊙ trim";
}

async function doAct(cmd){
  try{
    let url='/zone/act?cmd='+cmd;
    if(cmd==='save'){
      const name=document.getElementById('zone-name').value.trim()||'Zone';
      url+='&name='+encodeURIComponent(name);
    }
    const r=await fetch(url,{method:'POST'});
    if(!r.ok) throw new Error(r.status);
    applyState(await r.json());
    setConn(true);
    if(cmd==='save'){
      toast('Zone saved ✓');
      // Zone geometry changed -- clear cached heatmap data so stale coverage
      // is not shown.  Files were deleted server-side; clear JS state too.
      lastRun=null; waterCSVRows=null; draw();
    }
    if(cmd==='add_pt') toast('Point '+ST.points.length+' added');
    if(cmd==='cancel') window.history.back();
  }catch(e){ setConn(false); }
}

// Hold-repeat for dpad.
// Valve buttons use a two-phase strategy:
//   Step 1        : full pres_up/dn (motor + 300ms PSI settle) so throw updates on a single tap.
//   Steps 2+      : pres_up/dn_move (motor only, ~250ms) with acceleration 0.5->1.0->1.5 deg.
//   After release : poll() fires after settle delay to refresh the throw display.
// Nozzle buttons: sequential, same command every repeat.
let _hTimer=null, _hBtn=null, _hActive=false, _hStep=0, _hIsValve=false;
function _holdDeg(n){ return n<=4?0.5:n<=8?1.0:1.5; }
function holdStart(cmd,el){
  holdStop();
  _hBtn=el; el.classList.add('held');
  _hActive=true; _hStep=0;
  _hIsValve=(cmd==='pres_up'||cmd==='pres_dn');
  (async function loop(){
    if(!_hActive) return;
    _hStep++;
    if(_hStep>180){ holdStop(); toast('hold auto-stopped'); return; }  // ~11s hard cap vs a stuck button
    var act;
    if(_hIsValve){
      if(_hStep===1) act=cmd+'&deg=0.5';           // full settle -- immediate throw feedback
      else           act=cmd+'_move&deg='+_holdDeg(_hStep); // motor-only -- fast repeat
    } else {
      act=cmd;
    }
    await doAct(act).catch(()=>{});
    if(_hActive) _hTimer=setTimeout(loop,60);
  })();
}
function holdStop(){
  var wasValve=_hIsValve;
  _hActive=false; _hStep=0; _hIsValve=false;
  if(_hTimer){clearTimeout(_hTimer);_hTimer=null;}
  if(_hBtn){_hBtn.classList.remove('held');_hBtn=null;}
  // After releasing a valve button: wait for the valve to settle then poll for
  // updated PSI/throw.  The move-only hold commands skip settle, so we need this.
  if(wasValve) setTimeout(function(){ fetch('/zone/state').then(r=>r.json()).then(applyState).catch(()=>{}); }, 350);
}
// Safety net: a missed pointerup/leave on mobile (pointercancel fires for
// gestures/long-press) must never leave a button stuck hammering the device
// with valve commands (the TaskWDT crash during zone setup). ANY pointer
// release/cancel or focus loss stops the hold-repeat.
['pointerup','pointercancel'].forEach(function(ev){ window.addEventListener(ev, holdStop); });
window.addEventListener('blur', holdStop);
document.addEventListener('visibilitychange', function(){ if(document.hidden) holdStop(); });

// ── Connection indicator ────────────────────────────────────────
function setConn(ok){
  const d=document.getElementById('conn-dot');
  const l=document.getElementById('conn-label');
  d.className=ok?'ok':'err';
  l.textContent=ok?'live':'offline';
}

// ── Toast ───────────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.style.opacity='0',2000);
}

// ── Poll ────────────────────────────────────────────────────────
// Sequential: schedule next poll only after current fetch completes.
// ── b400: on-device point editor (drag / delete interior points) ─────
function _setEditUI(on){
  document.getElementById('edit-bar').style.display     = on?'flex':'none';
  document.getElementById('dpad-section').style.display = on?'none':'';
  document.getElementById('secondary').style.display    = on?'none':'';
  document.getElementById('footer').style.display       = on?'none':'';
  CV.style.touchAction = on?'none':'';   // let the canvas own touch drags in edit mode
}
function toggleEdit(){
  if(_editMode){ cancelEdit(); return; }
  if(!ST.points || ST.points.length<1){ toast('No points to edit'); return; }
  _editMode=true; _selPt=-1; _dragging=false; _setEditUI(true);
  toast('Edit: drag a point; tap + Delete pt to remove');
  draw();
}
function exitEdit(){ _editMode=false; _selPt=-1; _dragging=false; _setEditUI(false); }
function cancelEdit(){  // discard local edits, reload authoritative device state
  exitEdit();
  fetch('/zone/state').then(r=>r.json()).then(applyState).catch(()=>{});
}
function deleteSelPoint(){
  if(_selPt<0 || _selPt>=ST.points.length){ toast('Tap a point first'); return; }
  ST.points.splice(_selPt,1); _selPt=-1; draw();
}
function _cxy(e){
  const r=CV.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(CV.width/r.width), y:(e.clientY-r.top)*(CV.height/r.height)};
}
function _hitPoint(x,y){
  let best=-1, bd=1e9; const thr=Math.max(16,_maxR*0.06);
  ST.points.forEach((p,i)=>{
    const rr=(p.throw_mm/_edScale())*_maxR, a=(p.deg-90)*Math.PI/180;
    const d=Math.hypot(_cx+Math.cos(a)*rr-x, _cy+Math.sin(a)*rr-y);
    if(d<bd){ bd=d; best=i; }
  });
  return bd<=thr ? best : -1;
}
CV.addEventListener('pointerdown',e=>{
  if(!_editMode) return;
  const {x,y}=_cxy(e); const h=_hitPoint(x,y);
  _selPt=h; _dragging=(h>=0);
  if(_dragging){ try{CV.setPointerCapture(e.pointerId);}catch(_){} }
  draw();
});
CV.addEventListener('pointermove',e=>{
  if(!_editMode||!_dragging||_selPt<0) return;
  const {x,y}=_cxy(e); const dx=x-_cx, dy=y-_cy;
  let r=Math.hypot(dx,dy)/_maxR*_edScale(); if(r>_edScale()) r=_edScale(); if(r<0) r=0;
  let deg=Math.atan2(dy,dx)*180/Math.PI+90; deg=((deg%360)+360)%360;
  ST.points[_selPt].throw_mm=r; ST.points[_selPt].deg=deg; draw();
});
function _endDrag(){ _dragging=false; }
CV.addEventListener('pointerup',_endDrag);
CV.addEventListener('pointercancel',_endDrag);
window.addEventListener('pointerup',_endDrag);   // safety: release if it ends off-canvas
async function saveEdits(){
  if(!ST.points || ST.points.length<2){ toast('Need at least 2 points'); return; }
  if(ST.points.length<3 && !confirm('Fewer than 3 points — save anyway?')) return;
  const zid=(_zoneIdParam==='new')?'new':_zoneIdParam;
  const nm=(document.getElementById('zone-name').value||ST.name||'Zone').slice(0,31);
  const body=JSON.stringify({ id:zid, name:nm, num_points:ST.points.length,
    points:ST.points.map(p=>({nozzle_deg:+(+p.deg).toFixed(2), throw_mm:+(+p.throw_mm).toFixed(1),
                              pressure:+(+(p.psi||0)).toFixed(4), walk_idx:+(p.widx||0)})) });
  const btn=document.getElementById('btn-edit-save'); if(btn) btn.disabled=true;
  try{
    const r=await fetch('/zone/import?id='+encodeURIComponent(zid)+'&recompute=1',
                        {method:'POST',body}).then(x=>x.json());
    if(r&&r.ok){ toast('Saved zone '+r.id+' ('+r.num_points+' pts)'); exitEdit();
      fetch('/zone/state').then(x=>x.json()).then(applyState).catch(()=>{}); }
    else toast('Save failed: '+((r&&r.error)||'?'));
  }catch(e){ toast('Save error'); }
  finally{ if(btn) btn.disabled=false; }
}

var _pollTimer=null;
async function poll(){
  if(_editMode){ _pollTimer=setTimeout(poll,900); return; }  // b400: don't clobber edits
  try{
    const r=await fetch('/zone/state');
    if(!r.ok) throw new Error();
    applyState(await r.json());
    setConn(true);
  }catch(e){ setConn(false); }
  _pollTimer=setTimeout(poll,900);
}

// ── Init ────────────────────────────────────────────────────────
window.addEventListener('resize',resizeCanvas);
resizeCanvas();
// Mark name field edited when user types so polling won't overwrite it
document.getElementById('zone-name').addEventListener('input',function(){
  this.dataset.edited='1';
});
poll();
</script>
</body>
