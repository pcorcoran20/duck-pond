# irrigoto manual control — drop into config/packages/
# Device: irrigoto-43c89c
# Give the OtO a DHCP reservation in UniFi, then set input_text.oto_ip once.

input_text:
  oto_ip:
    name: OtO IP
    initial: "192.168.1.50"   # <- change to your reservation

input_boolean:
  # Mirror: swap left/right and further/closer. Flip it on when you are
  # standing on the far side of the patch facing the sprinkler, so the
  # arrows match what you see. Keyboard: M.
  oto_mirror:
    name: OtO Mirror controls
    icon: mdi:flip-horizontal

input_number:
  oto_bearing:
    name: OtO Bearing
    min: 0
    max: 359
    step: 1
    unit_of_measurement: "°"
    icon: mdi:compass
  oto_throw_ft:
    name: OtO Throw
    min: 2
    # 20 ft is where this unit's calibration table ends: above it every
    # request maps to the same valve angle, so "closer" clicks do nothing
    # until the number is back under 20. Re-cal and raise if the unit can
    # genuinely reach further.
    max: 20
    # Half-foot resolution: at 4 ft that is ~1.2 deg of valve, above the
    # firmware's 0.6 deg finish tolerance (b545). Quarter steps are allowed
    # on the step knob below but sit at the noise floor.
    step: 0.25
    unit_of_measurement: ft
    icon: mdi:arrow-expand-horizontal
  oto_step_deg:
    name: OtO Bearing Step
    min: 1
    max: 45
    step: 1
    unit_of_measurement: "°"
    initial: 10
  oto_sweep_width:
    name: OtO Sweep Width
    min: 10
    max: 300
    step: 5
    unit_of_measurement: "°"
    initial: 60
    icon: mdi:angle-acute
  oto_sweep_depth_ft:
    name: OtO Sweep Depth
    min: 1
    max: 18
    step: 0.5
    unit_of_measurement: ft
    initial: 4
    icon: mdi:arrow-expand-vertical
  oto_sweep_minutes:
    name: OtO Sweep Minutes
    min: 1
    max: 10
    step: 1
    unit_of_measurement: min
    initial: 3
    icon: mdi:timer-outline
  # Swing: how many Left/Right presses either side of the mark the nozzle
  # swings (width = 2 x presses x Bearing Step), at the joystick's throw.
  oto_swing_presses:
    name: OtO Swing Presses
    min: 1
    max: 12
    step: 1
    initial: 3
    icon: mdi:arrow-left-right
  oto_step_ft:
    name: OtO Throw Step
    min: 0.25
    max: 10
    step: 0.25
    unit_of_measurement: ft
    initial: 0.5

rest_command:
  oto_aim_throw:
    url: "http://{{ states('input_text.oto_ip') }}/aim/throw?bearing={{ bearing }}&throw={{ throw_mm }}"
    method: GET
    timeout: 15
  oto_valve_open:
    url: "http://{{ states('input_text.oto_ip') }}/valve/open"
    method: POST
  oto_valve_close:
    url: "http://{{ states('input_text.oto_ip') }}/valve/close"
    method: POST
  # Firmware mode codes: 1=1/8" 2=1/4" 3=1/8"x2 5=gentle 1/8" 6=gentle 1/4"
  # 7=smooth 8=serpentine c=chase d=demo. Names are mapped here so scripts
  # can say "smooth" etc.
  oto_water_zone:
    url: "http://{{ states('input_text.oto_ip') }}/zone/water"
    method: POST
    content_type: "application/x-www-form-urlencoded"
    payload: >-
      {% set m = mode | default('smooth') | string %}
      {% set codes = {'pulse':'1','quarter':'2','double':'3','gentle':'5','gentle_quarter':'6','smooth':'7','serpentine':'8','chase':'c','oscillate':'o','demo':'d'} %}
      id={{ zone_id }}&mode={{ codes[m] if m in codes else m }}{% if duration is defined %}&duration={{ duration }}{% endif %}
  # b546: water an ad-hoc sector (no saved zone): bearing+width in degrees,
  # near/far in mm. The firmware builds the polygon in RAM and runs it through
  # the normal zone planner, so every mode above works.
  oto_water_sector:
    url: "http://{{ states('input_text.oto_ip') }}/zone/water"
    method: POST
    content_type: "application/x-www-form-urlencoded"
    payload: >-
      {% set m = mode | default('serpentine') | string %}
      {% set codes = {'pulse':'1','quarter':'2','double':'3','gentle':'5','gentle_quarter':'6','smooth':'7','serpentine':'8','chase':'c','oscillate':'o','demo':'d'} %}
      bearing={{ bearing }}&width={{ width }}&near={{ near_mm }}&far={{ far_mm }}&mode={{ codes[m] if m in codes else m }}{% if duration is defined %}&duration={{ duration }}{% endif %}{% if swing is defined %}&swing={{ swing }}{% endif %}
  oto_water_cancel:
    url: "http://{{ states('input_text.oto_ip') }}/zone/water/cancel"
    method: POST

script:
  # Point the nozzle at the current bearing/throw and open the valve to match.
  oto_aim:
    alias: "OtO: aim (water at bearing/throw)"
    # restart: a burst of joystick taps ends at the latest bearing/throw
    # instead of replaying every intermediate target one by one.
    mode: restart
    sequence:
      - action: rest_command.oto_aim_throw
        data:
          bearing: "{{ states('input_number.oto_bearing') | int }}"
          throw_mm: "{{ (states('input_number.oto_throw_ft') | float * 304.8) | round(0) }}"

  oto_on:
    alias: "OtO: ON"
    sequence:
      - action: script.oto_aim

  oto_off:
    alias: "OtO: OFF (stop + close valve)"
    sequence:
      - action: rest_command.oto_water_cancel
      - action: esphome.irrigoto_43c89c_stop   # stop_and_close, via the ESPHome API

  # Sweep back and forth across a sector centred on the current aim: the
  # bearing slider is the centre, Sweep Width the angle, Sweep Depth the
  # radial band (half in front of the throw slider's distance, half behind).
  # Default mode is oscillate (b549): a steady lawn-sprinkler swing, nozzle
  # side to side and valve in and out, for Sweep Minutes. Pass
  # mode: serpentine for a metered 1/8" pass (rings, ~30 s on a small
  # sector) or mode: chase for the playful random version.
  oto_sweep:
    alias: "OtO: sweep here"
    mode: single
    fields:
      mode:     { description: "oscillate | serpentine | smooth | pulse | gentle | chase", example: oscillate }
      duration: { description: "minutes, oscillate/chase only (1-10); default Sweep Minutes", example: 5 }
    sequence:
      - variables:
          centre_ft: "{{ states('input_number.oto_throw_ft') | float }}"
          depth_ft:  "{{ states('input_number.oto_sweep_depth_ft') | float }}"
          near_ft:   "{{ [centre_ft - depth_ft / 2, 2] | max }}"
          far_ft:    "{{ [centre_ft + depth_ft / 2, 20] | min }}"
      # If a joystick tap is still settling, let it finish first: the device
      # has no interlock between /aim/throw and /zone/water, and two movers
      # on the same motors would fight over the pre-check aim.
      - wait_template: "{{ is_state('script.oto_aim', 'off') }}"
        timeout: "00:00:10"
      - action: rest_command.oto_water_sector
        data:
          bearing: "{{ states('input_number.oto_bearing') | int }}"
          width:   "{{ states('input_number.oto_sweep_width') | int }}"
          near_mm: "{{ (near_ft * 304.8) | round(0) }}"
          far_mm:  "{{ (far_ft * 304.8) | round(0) }}"
          mode:    "{{ mode | default('oscillate') }}"
          duration: "{{ duration | default(states('input_number.oto_sweep_minutes') | int) }}"

  # Joystick taps. With input_boolean.oto_mirror on, Up/Down and Left/Right
  # swap, so the arrows match the view from the far side of the patch.
  oto_up:
    alias: "OtO: throw further"
    mode: queued
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_throw_ft }
        data:
          value: >-
            {% set d = states('input_number.oto_step_ft') | float %}
            {% set d = -d if is_state('input_boolean.oto_mirror', 'on') else d %}
            {{ [[states('input_number.oto_throw_ft') | float + d, 2] | max, 20] | min }}
      - action: script.oto_aim

  oto_down:
    alias: "OtO: throw closer"
    mode: queued
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_throw_ft }
        data:
          value: >-
            {% set d = states('input_number.oto_step_ft') | float %}
            {% set d = -d if is_state('input_boolean.oto_mirror', 'on') else d %}
            {{ [[states('input_number.oto_throw_ft') | float - d, 2] | max, 20] | min }}
      - action: script.oto_aim

  oto_left:
    alias: "OtO: rotate left"
    mode: queued
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_bearing }
        data:
          value: >-
            {% set d = states('input_number.oto_step_deg') | int %}
            {% set d = -d if is_state('input_boolean.oto_mirror', 'on') else d %}
            {{ (states('input_number.oto_bearing') | int - d) % 360 }}
      - action: script.oto_aim

  oto_right:
    alias: "OtO: rotate right"
    mode: queued
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_bearing }
        data:
          value: >-
            {% set d = states('input_number.oto_step_deg') | int %}
            {% set d = -d if is_state('input_boolean.oto_mirror', 'on') else d %}
            {{ (states('input_number.oto_bearing') | int + d) % 360 }}
      - action: script.oto_aim

  oto_mirror_toggle:
    alias: "OtO: toggle mirror"
    sequence:
      - action: input_boolean.toggle
        target: { entity_id: input_boolean.oto_mirror }

  # Swing: left/right only, at the joystick's throw, Swing Presses x Bearing
  # Step either side of the mark, for Sweep Minutes. Keyboard: W.
  oto_swing:
    alias: "OtO: swing left/right here"
    mode: single
    fields:
      duration: { description: "minutes (1-10); default Sweep Minutes", example: 3 }
    sequence:
      - variables:
          half_deg: "{{ states('input_number.oto_swing_presses') | int * states('input_number.oto_step_deg') | int }}"
          width:    "{{ [[half_deg * 2, 10] | max, 300] | min }}"
          throw_mm: "{{ states('input_number.oto_throw_ft') | float * 304.8 }}"
      - wait_template: "{{ is_state('script.oto_aim', 'off') }}"
        timeout: "00:00:10"
      - action: rest_command.oto_water_sector
        data:
          bearing:  "{{ states('input_number.oto_bearing') | int }}"
          width:    "{{ width }}"
          near_mm:  "{{ (throw_mm - 160) | round(0) }}"
          far_mm:   "{{ (throw_mm + 160) | round(0) }}"
          mode:     oscillate
          duration: "{{ duration | default(states('input_number.oto_sweep_minutes') | int) }}"
          swing:    1

  # Hands-free: run a saved zone from the OtO's own zone list.
  oto_water_zone:
    alias: "OtO: water zone"
    fields:
      zone_id: { description: "Zone id from /api/zones", example: 0 }
      mode:    { description: "smooth | pulse | gentle | chase", example: smooth }
    sequence:
      - action: rest_command.oto_water_zone
        data:
          zone_id: "{{ zone_id }}"
          mode: "{{ mode | default('smooth') }}"
