# irrigoto manual control — drop into config/packages/
# Device: irrigoto-43c89c
# Give the OtO a DHCP reservation in UniFi, then set input_text.oto_ip once.

input_text:
  oto_ip:
    name: OtO IP
    initial: "192.168.1.50"   # <- change to your reservation
  # Pool outline: "bearing:throw_ft" tokens, one per edge point the joystick
  # was aimed at (script.oto_pool_point_add). Up to ~25 points in 255 chars.
  oto_pool_outline:
    name: OtO Pool Outline
    max: 255
    initial: ""
    icon: mdi:vector-polygon

input_boolean:
  # Mirror: swap left/right and further/closer. Flip it on when you are
  # standing on the far side of the patch facing the sprinkler, so the
  # arrows match what you see. Keyboard: M.
  oto_mirror:
    name: OtO Mirror controls
    icon: mdi:flip-horizontal

input_number:
  oto_bearing:
    name: OtO Bearing
    min: 0
    max: 359
    step: 1
    unit_of_measurement: "°"
    icon: mdi:compass
  oto_throw_ft:
    name: OtO Throw
    min: 2
    # 20 ft is where this unit's calibration table ends: above it every
    # request maps to the same valve angle, so "closer" clicks do nothing
    # until the number is back under 20. Re-cal and raise if the unit can
    # genuinely reach further.
    max: 20
    # Half-foot resolution: at 4 ft that is ~1.2 deg of valve, above the
    # firmware's 0.6 deg finish tolerance (b545). Quarter steps are allowed
    # on the step knob below but sit at the noise floor.
    step: 0.25
    unit_of_measurement: ft
    icon: mdi:arrow-expand-horizontal
  oto_step_deg:
    name: OtO Bearing Step
    min: 1
    max: 45
    step: 1
    unit_of_measurement: "°"
    initial: 10
  oto_sweep_width:
    name: OtO Sweep Width
    min: 10
    max: 300
    step: 5
    unit_of_measurement: "°"
    initial: 60
    icon: mdi:angle-acute
  oto_sweep_depth_ft:
    name: OtO Sweep Depth
    min: 1
    max: 18
    step: 0.5
    unit_of_measurement: ft
    initial: 4
    icon: mdi:arrow-expand-vertical
  oto_sweep_minutes:
    name: OtO Sweep Minutes
    min: 1
    max: 10
    step: 1
    unit_of_measurement: min
    initial: 3
    icon: mdi:timer-outline
  # Swing: how many Left/Right presses either side of the mark the nozzle
  # swings (width = 2 x presses x Bearing Step), at the joystick's throw.
  oto_swing_presses:
    name: OtO Swing Presses
    min: 1
    max: 12
    step: 1
    initial: 3
    icon: mdi:arrow-left-right
  oto_step_ft:
    name: OtO Throw Step
    min: 0.25
    max: 10
    step: 0.25
    unit_of_measurement: ft
    initial: 0.5
  # Pool clean (b552): a saved sector over the duck pool. Aim the joystick at
  # the middle of the pool once, press "Set pool here", and Pool Clean then
  # sweeps the stream round the pool for Pool Minutes whenever you like.
  # Rings: 0 = cover the whole pool (auto, ~10 in apart); 2 = trace the near
  # and far rims only (one loop round the edge per swing pair).
  oto_pool_bearing:
    name: OtO Pool Bearing
    min: 0
    max: 359
    step: 1
    unit_of_measurement: "°"
    icon: mdi:pool
  oto_pool_throw_ft:
    name: OtO Pool Throw
    min: 2
    max: 20
    step: 0.25
    unit_of_measurement: ft
    initial: 4.5
    icon: mdi:pool
  oto_pool_width:
    name: OtO Pool Width
    min: 10
    max: 300
    step: 5
    unit_of_measurement: "°"
    initial: 40
    icon: mdi:angle-acute
  oto_pool_depth_ft:
    name: OtO Pool Depth
    min: 1
    max: 18
    step: 0.5
    unit_of_measurement: ft
    initial: 4
    icon: mdi:arrow-expand-vertical
  oto_pool_minutes:
    name: OtO Pool Minutes
    min: 1
    max: 10
    step: 1
    unit_of_measurement: min
    initial: 5
    icon: mdi:timer-outline
  oto_pool_rings:
    name: OtO Pool Rings (0 = auto)
    min: 0
    max: 8
    step: 1
    initial: 0
    icon: mdi:circle-multiple-outline
  oto_pool_margin_ft:
    name: OtO Pool Margin
    min: 0
    max: 3
    step: 0.25
    unit_of_measurement: ft
    initial: 0.5
    icon: mdi:arrow-expand-all

rest_command:
  oto_aim_throw:
    url: "http://{{ states('input_text.oto_ip') }}/aim/throw?bearing={{ bearing }}&throw={{ throw_mm }}"
    method: GET
    timeout: 15
  oto_valve_open:
    url: "http://{{ states('input_text.oto_ip') }}/valve/open"
    method: POST
  oto_valve_close:
    url: "http://{{ states('input_text.oto_ip') }}/valve/close"
    method: POST
  # Firmware mode codes: 1=1/8" 2=1/4" 3=1/8"x2 5=gentle 1/8" 6=gentle 1/4"
  # 7=smooth 8=serpentine c=chase d=demo. Names are mapped here so scripts
  # can say "smooth" etc.
  oto_water_zone:
    url: "http://{{ states('input_text.oto_ip') }}/zone/water"
    method: POST
    content_type: "application/x-www-form-urlencoded"
    payload: >-
      {% set m = mode | default('smooth') | string %}
      {% set codes = {'pulse':'1','quarter':'2','double':'3','gentle':'5','gentle_quarter':'6','smooth':'7','serpentine':'8','chase':'c','oscillate':'o','demo':'d'} %}
      id={{ zone_id }}&mode={{ codes[m] if m in codes else m }}{% if duration is defined %}&duration={{ duration }}{% endif %}
  # b546: water an ad-hoc sector (no saved zone): bearing+width in degrees,
  # near/far in mm. The firmware builds the polygon in RAM and runs it through
  # the normal zone planner, so every mode above works.
  oto_water_sector:
    url: "http://{{ states('input_text.oto_ip') }}/zone/water"
    method: POST
    content_type: "application/x-www-form-urlencoded"
    payload: >-
      {% set m = mode | default('serpentine') | string %}
      {% set codes = {'pulse':'1','quarter':'2','double':'3','gentle':'5','gentle_quarter':'6','smooth':'7','serpentine':'8','chase':'c','oscillate':'o','demo':'d'} %}
      bearing={{ bearing }}&width={{ width }}&near={{ near_mm }}&far={{ far_mm }}&mode={{ codes[m] if m in codes else m }}{% if duration is defined %}&duration={{ duration }}{% endif %}{% if swing is defined %}&swing={{ swing }}{% endif %}{% if rings is defined and rings | int >= 2 %}&rings={{ rings | int }}{% endif %}
  oto_water_cancel:
    url: "http://{{ states('input_text.oto_ip') }}/zone/water/cancel"
    method: POST
  # b552: stop a running swing/sweep but keep the water on -- the nozzle parks
  # on the centre mark at the band-centre throw with the valve open.
  oto_water_hold:
    url: "http://{{ states('input_text.oto_ip') }}/zone/water/hold"
    method: POST

script:
  # Point the nozzle at the current bearing/throw and open the valve to match.
  oto_aim:
    alias: "OtO: aim (water at bearing/throw)"
    # restart: a burst of joystick taps ends at the latest bearing/throw
    # instead of replaying every intermediate target one by one.
    mode: restart
    sequence:
      - action: rest_command.oto_aim_throw
        data:
          bearing: "{{ states('input_number.oto_bearing') | int }}"
          throw_mm: "{{ (states('input_number.oto_throw_ft') | float * 304.8) | round(0) }}"

  oto_on:
    alias: "OtO: ON"
    sequence:
      - action: script.oto_aim

  oto_off:
    alias: "OtO: OFF (stop + close valve)"
    sequence:
      - action: rest_command.oto_water_cancel
      - action: esphome.irrigoto_43c89c_stop   # stop_and_close, via the ESPHome API

  # Sweep back and forth across a sector centred on the current aim: the
  # bearing slider is the centre, Sweep Width the angle, Sweep Depth the
  # radial band (half in front of the throw slider's distance, half behind).
  # Default mode is oscillate (b549): a steady lawn-sprinkler swing, nozzle
  # side to side and valve in and out, for Sweep Minutes. Pass
  # mode: serpentine for a metered 1/8" pass (rings, ~30 s on a small
  # sector) or mode: chase for the playful random version.
  oto_sweep:
    alias: "OtO: sweep here"
    mode: single
    fields:
      mode:     { description: "oscillate | serpentine | smooth | pulse | gentle | chase", example: oscillate }
      duration: { description: "minutes, oscillate/chase only (1-10); default Sweep Minutes", example: 5 }
    sequence:
      - variables:
          centre_ft: "{{ states('input_number.oto_throw_ft') | float }}"
          depth_ft:  "{{ states('input_number.oto_sweep_depth_ft') | float }}"
          near_ft:   "{{ [centre_ft - depth_ft / 2, 2] | max }}"
          far_ft:    "{{ [centre_ft + depth_ft / 2, 20] | min }}"
      # If a joystick tap is still settling, let it finish first: the device
      # has no interlock between /aim/throw and /zone/water, and two movers
      # on the same motors would fight over the pre-check aim.
      - wait_template: "{{ is_state('script.oto_aim', 'off') }}"
        timeout: "00:00:10"
      - action: rest_command.oto_water_sector
        data:
          bearing: "{{ states('input_number.oto_bearing') | int }}"
          width:   "{{ states('input_number.oto_sweep_width') | int }}"
          near_mm: "{{ (near_ft * 304.8) | round(0) }}"
          far_mm:  "{{ (far_ft * 304.8) | round(0) }}"
          mode:    "{{ mode | default('oscillate') }}"
          duration: "{{ duration | default(states('input_number.oto_sweep_minutes') | int) }}"

  # Joystick taps. With input_boolean.oto_mirror on, Up/Down and Left/Right
  # swap, so the arrows match the view from the far side of the patch.
  oto_up:
    alias: "OtO: throw further"
    mode: queued
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_throw_ft }
        data:
          value: >-
            {% set d = states('input_number.oto_step_ft') | float %}
            {% set d = -d if is_state('input_boolean.oto_mirror', 'on') else d %}
            {{ [[states('input_number.oto_throw_ft') | float + d, 2] | max, 20] | min }}
      - action: script.oto_aim

  oto_down:
    alias: "OtO: throw closer"
    mode: queued
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_throw_ft }
        data:
          value: >-
            {% set d = states('input_number.oto_step_ft') | float %}
            {% set d = -d if is_state('input_boolean.oto_mirror', 'on') else d %}
            {{ [[states('input_number.oto_throw_ft') | float - d, 2] | max, 20] | min }}
      - action: script.oto_aim

  oto_left:
    alias: "OtO: rotate left"
    mode: queued
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_bearing }
        data:
          value: >-
            {% set d = states('input_number.oto_step_deg') | int %}
            {% set d = -d if is_state('input_boolean.oto_mirror', 'on') else d %}
            {{ (states('input_number.oto_bearing') | int - d) % 360 }}
      - action: script.oto_aim

  oto_right:
    alias: "OtO: rotate right"
    mode: queued
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_bearing }
        data:
          value: >-
            {% set d = states('input_number.oto_step_deg') | int %}
            {% set d = -d if is_state('input_boolean.oto_mirror', 'on') else d %}
            {{ (states('input_number.oto_bearing') | int + d) % 360 }}
      - action: script.oto_aim

  oto_mirror_toggle:
    alias: "OtO: toggle mirror"
    sequence:
      - action: input_boolean.toggle
        target: { entity_id: input_boolean.oto_mirror }

  # Swing: left/right only, at the joystick's throw, Swing Presses x Bearing
  # Step either side of the mark, for Sweep Minutes. Keyboard: W.
  oto_swing:
    alias: "OtO: swing left/right here"
    mode: single
    fields:
      duration: { description: "minutes (1-10); default Sweep Minutes", example: 3 }
    sequence:
      - variables:
          half_deg: "{{ states('input_number.oto_swing_presses') | int * states('input_number.oto_step_deg') | int }}"
          width:    "{{ [[half_deg * 2, 10] | max, 300] | min }}"
          throw_mm: "{{ states('input_number.oto_throw_ft') | float * 304.8 }}"
      - wait_template: "{{ is_state('script.oto_aim', 'off') }}"
        timeout: "00:00:10"
      - action: rest_command.oto_water_sector
        data:
          bearing:  "{{ states('input_number.oto_bearing') | int }}"
          width:    "{{ width }}"
          near_mm:  "{{ (throw_mm - 160) | round(0) }}"
          far_mm:   "{{ (throw_mm + 160) | round(0) }}"
          mode:     oscillate
          duration: "{{ duration | default(states('input_number.oto_sweep_minutes') | int) }}"
          swing:    1

  # Hold: stop the swing/sweep where it is centred, water still on. The
  # joystick then works as normal; OFF closes the valve. Keyboard: H.
  # (While a swing or sweep is running, the arrow keys / buttons MOVE it:
  # the firmware recentres the arc on the new bearing and shifts the throw
  # band instead of refusing the aim.)
  oto_hold:
    alias: "OtO: hold (stop swing, keep watering)"
    sequence:
      - action: rest_command.oto_water_hold

  # Pool clean: remember where the pool is, then sweep it on demand.
  oto_pool_set_here:
    alias: "OtO: set pool = current aim"
    sequence:
      - action: input_number.set_value
        target: { entity_id: input_number.oto_pool_bearing }
        data: { value: "{{ states('input_number.oto_bearing') | int }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.oto_pool_throw_ft }
        data: { value: "{{ states('input_number.oto_throw_ft') | float }}" }

  oto_pool_clean:
    alias: "OtO: pool clean"
    mode: single
    fields:
      minutes: { description: "1-10; default Pool Minutes", example: 5 }
      rings:   { description: "0 = whole pool, 2 = rims only; default Pool Rings", example: 0 }
    sequence:
      - variables:
          centre_ft: "{{ states('input_number.oto_pool_throw_ft') | float }}"
          depth_ft:  "{{ states('input_number.oto_pool_depth_ft') | float }}"
          near_ft:   "{{ [centre_ft - depth_ft / 2, 2] | max }}"
          far_ft:    "{{ [centre_ft + depth_ft / 2, 20] | min }}"
      - wait_template: "{{ is_state('script.oto_aim', 'off') }}"
        timeout: "00:00:10"
      - action: rest_command.oto_water_sector
        data:
          bearing:  "{{ states('input_number.oto_pool_bearing') | int }}"
          width:    "{{ states('input_number.oto_pool_width') | int }}"
          near_mm:  "{{ (near_ft * 304.8) | round(0) }}"
          far_mm:   "{{ (far_ft * 304.8) | round(0) }}"
          mode:     oscillate
          duration: "{{ minutes | default(states('input_number.oto_pool_minutes') | int) }}"
          rings:    "{{ rings | default(states('input_number.oto_pool_rings') | int) }}"

  # Pool outline: walk the stream round the pool edge with the joystick and
  # press "Add point" at each spot (4-8 points is plenty). The scripts keep
  # the points in input_text.oto_pool_outline and derive the pool sector
  # (bearing / width / throw / depth) from them, so Pool clean needs nothing
  # typed in. Pool Margin adds a little overshoot beyond the outline.
  # Keyboard: A = add point, Z = undo.
  oto_pool_point_add:
    alias: "OtO: pool outline -- add the current aim"
    mode: queued
    sequence:
      - variables:
          cur: "{{ states('input_text.oto_pool_outline') | trim }}"
          tok: "{{ states('input_number.oto_bearing') | int }}:{{ states('input_number.oto_throw_ft') | float | round(2) }}"
          new: "{{ (cur ~ ' ' ~ tok) | trim }}"
      - if:
          - condition: template
            value_template: "{{ new | length > 255 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: oto_pool_outline
              title: "OtO pool outline"
              message: "Outline is full ({{ cur.split() | count }} points) -- clear it or undo a point first."
          - stop: "outline full"
      - action: input_text.set_value
        target: { entity_id: input_text.oto_pool_outline }
        data: { value: "{{ new }}" }
      - action: script.oto_pool_outline_apply

  oto_pool_point_undo:
    alias: "OtO: pool outline -- undo the last point"
    mode: queued
    sequence:
      - action: input_text.set_value
        target: { entity_id: input_text.oto_pool_outline }
        data: { value: "{{ states('input_text.oto_pool_outline').split()[:-1] | join(' ') }}" }
      - action: script.oto_pool_outline_apply

  oto_pool_outline_clear:
    alias: "OtO: pool outline -- clear"
    sequence:
      - action: input_text.set_value
        target: { entity_id: input_text.oto_pool_outline }
        data: { value: "" }

  # Derive the pool sector from the outline points. Bearings: the arc is the
  # complement of the largest gap between sorted bearings (so an outline
  # straddling north works). Throws: min..max plus the margin. One point =
  # centre only (same as "Set pool here"); no points = leave everything alone.
  oto_pool_outline_apply:
    alias: "OtO: pool outline -- derive the pool sector"
    mode: queued
    sequence:
      - variables:
          margin: "{{ states('input_number.oto_pool_margin_ft') | float(0.5) }}"
          cur_width: "{{ states('input_number.oto_pool_width') | float(40) }}"
          cur_depth: "{{ states('input_number.oto_pool_depth_ft') | float(4) }}"
          sector: >-
            {% set raw = states('input_text.oto_pool_outline') %}
            {% set ns = namespace(b=[], t=[]) %}
            {% for tok in raw.split() if ':' in tok %}
              {% set p = tok.split(':') %}
              {% set ns.b = ns.b + [(p[0] | float(0)) % 360] %}
              {% set ns.t = ns.t + [p[1] | float(0)] %}
            {% endfor %}
            {% set n = ns.b | count %}
            {% if n == 0 %}
              {{ none }}
            {% else %}
              {% set near = [(ns.t | min) - margin, 2] | max %}
              {% set far  = [(ns.t | max) + margin, 20] | min %}
              {% if far < near + 1 %}{% set far = [near + 1, 20] | min %}{% set near = far - 1 %}{% endif %}
              {% set centre_t = (near + far) / 2 %}
              {% set depth = far - near %}
              {% if n == 1 %}
                {% set centre_b = ns.b[0] %}
                {% set centre_t = ns.t[0] %}
                {% set width = cur_width %}
                {% set depth = cur_depth %}
              {% else %}
                {% set bs = ns.b | sort %}
                {% set g = namespace(best=-1, k=0) %}
                {% for i in range(n) %}
                  {% set gap = (bs[0] + 360 - bs[n - 1]) if i == n - 1 else (bs[i + 1] - bs[i]) %}
                  {% if gap > g.best %}{% set g.best = gap %}{% set g.k = i %}{% endif %}
                {% endfor %}
                {% set start = bs[(g.k + 1) % n] %}
                {% set span = 360 - g.best %}
                {% set width = span + 2 * (margin / centre_t) * 57.3 %}
                {% set centre_b = (start + span / 2) % 360 %}
              {% endif %}
              {{ {'bearing': (centre_b | round(0) | int) % 360,
                  'width':   [[(((width / 5) | round(0)) * 5) | int, 10] | max, 300] | min,
                  'throw':   [[((centre_t * 4) | round(0)) / 4, 2] | max, 20] | min,
                  'depth':   [[((depth * 2) | round(0)) / 2, 1] | max, 18] | min} }}
            {% endif %}
      - condition: template
        value_template: "{{ sector is mapping }}"
      - action: input_number.set_value
        target: { entity_id: input_number.oto_pool_bearing }
        data: { value: "{{ sector.bearing }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.oto_pool_width }
        data: { value: "{{ sector.width }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.oto_pool_throw_ft }
        data: { value: "{{ sector.throw }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.oto_pool_depth_ft }
        data: { value: "{{ sector.depth }}" }

  # Hands-free: run a saved zone from the OtO's own zone list.
  oto_water_zone:
    alias: "OtO: water zone"
    fields:
      zone_id: { description: "Zone id from /api/zones", example: 0 }
      mode:    { description: "smooth | pulse | gentle | chase", example: smooth }
    sequence:
      - action: rest_command.oto_water_zone
        data:
          zone_id: "{{ zone_id }}"
          mode: "{{ mode | default('smooth') }}"

template:
  - sensor:
      - name: "OtO Pool Outline Summary"
        unique_id: oto_pool_outline_summary
        icon: mdi:pool
        state: >-
          {% set n = states('input_text.oto_pool_outline').split() | count %}
          {% if n == 0 %}no outline -- aim at the pool edge and press Add point
          {% else %}{{ n }} pt{{ 's' if n != 1 }} · {{ states('input_number.oto_pool_bearing') | int }}° ± {{ (states('input_number.oto_pool_width') | float(0) / 2) | round(0) | int }}° · {{ states('input_number.oto_pool_throw_ft') | float(0) }} ft ± {{ (states('input_number.oto_pool_depth_ft') | float(0) / 2) | round(2) }} ft
          {% endif %}
